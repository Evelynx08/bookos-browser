// Aether Browser — la primera línea de este fichero la ignora Firefox.
//
// Lo carga defaults/pref/autoconfig.js al arrancar. Hace dos cosas: fija las
// prefs de privacidad y de interfaz, y monta la piel y el script de BookOS en
// cada ventana. Se eligió autoconfig y no userChrome.css del perfil porque así
// la interfaz va con la instalación: un perfil nuevo o borrado sale igual, y
// no depende de toolkit.legacyUserProfileCustomizations.stylesheets.

// ── Privacidad ──────────────────────────────────────────────────────────────
// Lo que cubren las políticas (telemetría, ETP estricto, HTTPS-only,
// buscadores) está en distribution/policies.json; aquí va el resto.
defaultPref("privacy.globalprivacycontrol.enabled", true);
defaultPref("network.prefetch-next", false);
defaultPref("network.dns.disablePrefetch", true);
defaultPref("network.predictor.enabled", false);
defaultPref("browser.urlbar.speculativeConnect.enabled", false);
defaultPref("browser.places.speculativeConnect.enabled", false);
defaultPref("media.peerconnection.ice.default_address_only", true);
defaultPref("datareporting.healthreport.uploadEnabled", false);
defaultPref("datareporting.policy.dataSubmissionEnabled", false);
defaultPref("browser.newtabpage.activity-stream.showSponsored", false);
defaultPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
defaultPref("browser.urlbar.suggest.quicksuggest.sponsored", false);
defaultPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
defaultPref("browser.urlbar.trending.featureGate", false);
defaultPref("browser.ml.chat.enabled", false);
defaultPref("browser.shopping.experience2023.enabled", false);
defaultPref("extensions.getAddons.showPane", false);
defaultPref("extensions.htmlaboutaddons.recommendations.enabled", false);
defaultPref("browser.aboutConfig.showWarning", false);
defaultPref("app.shield.optoutstudies.enabled", false);
defaultPref("messaging-system.rsexperimentloader.enabled", false);
// Las funciones de IA de Firefox (ventana inteligente con modelo remoto,
// chatbots, agrupación de pestañas) fuera, con su botón en la barra de
// pestañas. La traducción sí se queda: corre en local y no manda el texto de
// la página a nadie. Valores de OnDeviceModelManager.mjs: default, available
// o blocked.
defaultPref("browser.ai.control.default", "blocked");
defaultPref("browser.ai.control.translations", "available");
defaultPref("browser.translations.enable", true);
// Que el botón de traducir avise, pero sin abrir el panel solo en cada página
// en otro idioma: tapaba la web al cargar.
defaultPref("browser.translations.automaticallyPopup", false);
defaultPref("browser.ml.enable", false);
defaultPref("browser.ml.chat.menu", false);
defaultPref("browser.ml.chat.page", false);
defaultPref("browser.ml.linkPreview.enabled", false);
defaultPref("extensions.ml.enabled", false);
defaultPref("browser.tabs.groups.smart.enabled", false);
defaultPref("browser.search.visualSearch.featureGate", false);
// Nova, el rediseño que Firefox 157 trae encendido: entre otras cosas pone
// overflow: clip en #navigator-toolbox (content-area.css) y recorta la barra
// de navegación, que aquí cuelga por debajo de la caja. La piel de BookOS
// está hecha sobre la interfaz clásica.
defaultPref("browser.nova.enabled", false);

// ── Lo que Firefox trae y aquí no pinta nada ───────────────────────────────
// Promociones de Mozilla (VPN, «más de Mozilla»), sugerencias rápidas (las
// sirve un tercero), recomendaciones de extensiones, perfiles múltiples y
// pestañas sincronizadas (sin cuenta de Firefox no hacen nada).
defaultPref("browser.vpn_promo.enabled", false);
defaultPref("browser.ipProtection.enabled", false);
defaultPref("browser.preferences.moreFromMozilla", false);
defaultPref("browser.urlbar.quicksuggest.enabled", false);
defaultPref("browser.discovery.enabled", false);
defaultPref("identity.fxaccounts.toolbar.enabled", false);
defaultPref("browser.profiles.enabled", false);
// Herramientas de la barra lateral: sin chatbot ni pestañas sincronizadas.
defaultPref("sidebar.main.tools", "history,bookmarks,opentabs");

// ── Interfaz ────────────────────────────────────────────────────────────────
// Vacío = el idioma del sistema. El paquete lo enlaza el lanzador en
// <perfil>/extensions/, y por eso ese ámbito (1) no se desactiva al instalar:
// el 15 de fábrica pedía confirmación para el propio idioma.
defaultPref("intl.locale.requested", "");
defaultPref("extensions.autoDisableScopes", 14);
defaultPref("browser.tabs.inTitlebar", 1);
defaultPref("browser.uidensity", 0);
defaultPref("browser.tabs.tabmanager.enabled", true);
defaultPref("sidebar.revamp", true);
defaultPref("sidebar.verticalTabs", false);
defaultPref("browser.toolbars.bookmarks.visibility", "never");
defaultPref("browser.compactmode.show", false);
defaultPref("browser.startup.homepage", "about:newtab");
// La pestaña nueva tiene que ser una página de verdad: desactivada, Firefox
// la trata como el about:blank inicial y la sustituye al cargar la primera
// web, y no había forma de volver atrás a la página de inicio (medido: una
// sola entrada en el historial tras newtab → bookos.es). Su contenido no se
// ve: lo tapa la página de inicio de BookOS (bookos.uc.js).
defaultPref("browser.newtabpage.enabled", true);
// Los «sitios destacados» de Firefox (Wikipedia, YouTube, Reddit, Amazon…)
// salían en el desplegable de la barra al enfocarla en la página de inicio.
defaultPref("browser.newtabpage.activity-stream.default.sites", "");
defaultPref("browser.urlbar.suggest.topsites", false);
// Fedora (browser/defaults/preferences/firefox-redhat-default-prefs.js, que
// el montaje enlaza) ancla su página de inicio como sitio destacado y ofrece
// credenciales Kerberos/SPNEGO a cualquier web https, pensando en redes de
// empresa. Fuera las dos.
defaultPref("browser.newtabpage.pinned", "[]");
defaultPref("network.negotiate-auth.trusted-uris", "");
defaultPref("browser.fullscreen.autohide", true);
// El compositor de BookOS pasa a pantalla completa sin animar (ventanas.rs:
// «un cambio a pantalla completa que se desliza se ve mal»); el fundido de
// Firefox encima de eso es un parpadeo negro de medio segundo.
defaultPref("full-screen-api.transition-duration.enter", "0 0");
defaultPref("full-screen-api.transition-duration.leave", "0 0");
defaultPref("full-screen-api.warning.timeout", 0);
// Gesto de dos dedos para ir atrás/adelante: ya viene activo en Firefox para
// Wayland (widget.disable-swipe-tracker = false) y el compositor de BookOS le
// pasa lo que necesita (origen «dedo» y fin de scroll). Se fija por si acaso y
// se agranda el círculo que asoma (12→16 y 20→26px de radio, con 72px de
// recorrido) para que se vea a la primera.
defaultPref("widget.disable-swipe-tracker", false);
defaultPref("browser.swipe.navigation-icon-min-radius", 16);
defaultPref("browser.swipe.navigation-icon-max-radius", 26);
defaultPref("browser.swipe.navigation-icon-end-position", 72);
defaultPref("bookos.dynamicPalette", true);
// Página de inicio (bookos.uc.js): fondo «color» (el de la paleta),
// «escritorio» (el fondo de pantalla de BookOS) o «imagen» (una propia).
defaultPref("bookos.inicio.fondo", "color");
defaultPref("bookos.inicio.imagen", "");
defaultPref("bookos.inicio.reloj", true);
defaultPref("bookos.inicio.favoritos", true);
// Barras de desplazamiento propias en todas partes (no las de GTK, que
// flotan finas y desaparecen): estilo 1, la píldora redondeada, a 12px para
// que se pueda agarrar sin buscarla. Su color lo pone bookos.uc.js desde la
// paleta.
defaultPref("widget.gtk.overlay-scrollbars.enabled", false);
defaultPref("widget.non-native-theme.scrollbar.style", 1);
defaultPref("widget.non-native-theme.scrollbar.size.override", 12);
// Abrir, guardar, subir y la imagen de fondo del inicio van por el portal
// FileChooser, que en BookOS es el explorador (AI-DESIGN-SYSTEM §9). El valor
// de fábrica, 2, solo usa el portal dentro de Flatpak o Snap: fuera abre el
// diálogo de GTK.
defaultPref("widget.use-xdg-desktop-portal.file-picker", 1);

// ── Rendimiento y memoria ───────────────────────────────────────────────────
// WebGPU viene apagado en Linux en Firefox 156, aunque la lista de bloqueo da
// la GPU por buena (STATUS_OK en la Arc 140V con Mesa): encendido, una
// página obtiene adaptador y dispositivo.
defaultPref("dom.webgpu.enabled", true);
// La pestaña nueva de Firefox no se ve (la tapa la página de inicio de
// BookOS), así que tenerla precargada es memoria para nada. Y de los tres
// procesos de reserva que Firefox deja arrancados para webs nuevas basta
// uno. Medido con 6 pestañas abiertas: 872-882 MB → 795-808 MB en total
// (privilegedabout 66 → 45 MB, dos procesos de 18 MB menos).
defaultPref("browser.newtab.preload", false);
defaultPref("dom.ipc.processPrelaunch.fission.number", 1);
// Descargar pestañas en segundo plano cuando el sistema se queda sin
// memoria. Firefox lo trae apagado en Linux.
defaultPref("browser.tabs.unloadOnLowMemory", true);

// ── Montaje de la interfaz ──────────────────────────────────────────────────
(() => {
  const raiz = Services.dirsvc.get("GreD", Ci.nsIFile);
  raiz.append("bookos");
  // resource://bookos/ apunta a <instalación>/bookos/. Con file:// los SVG no
  // pueden heredar el color con context-stroke: Firefox solo lo permite a
  // documentos con origen privilegiado.
  Services.io
    .getProtocolHandler("resource")
    .QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution("bookos", Services.io.newFileURI(raiz));
  // resource://aether/ → <instalación>/marca/: la marca para los paquetes de
  // idioma (bookos.uc.js).
  const marca = Services.dirsvc.get("GreD", Ci.nsIFile);
  marca.append("marca");
  Services.io
    .getProtocolHandler("resource")
    .QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution("aether", Services.io.newFileURI(marca));
  // Su chrome.manifest sustituye brand.properties (textos antiguos, como la
  // etiqueta «Firefox» de la barra de direcciones en las páginas internas).
  const manifiesto = marca.clone();
  manifiesto.append("chrome.manifest");
  Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifiesto);

  const NAVEGADOR = "chrome://browser/content/browser.xhtml";

  // La barra que se esconde al bajar necesita saber el scroll de la página,
  // que vive en el proceso de contenido. Solo el marco principal: el scroll
  // de un iframe no mueve la página.
  ChromeUtils.registerWindowActor("BookosScroll", {
    parent: { esModuleURI: "resource://bookos/BookosScrollParent.sys.mjs" },
    child: {
      esModuleURI: "resource://bookos/BookosScrollChild.sys.mjs",
      events: { pageshow: {} },
    },
    // Sin esto Firefox no lo carga en los procesos de páginas web (el error
    // dice «doesn't match remote type»). Es seguro: el hijo solo lee la
    // posición de scroll y no acepta nada que venga del padre.
    safeForUntrustedWebProcess: true,
  });

  Services.obs.addObserver(win => {
    win.addEventListener(
      "DOMContentLoaded",
      () => {
        if (win.location.href !== NAVEGADOR) return;
        // Antes del primer pintado: cargarla después enseñaba la piel de
        // Firefox un fotograma.
        win.windowUtils.loadSheetUsingURIString("resource://bookos/bookos.css", win.windowUtils.AUTHOR_SHEET);
      },
      { once: true }
    );
  }, "chrome-document-global-created");

  Services.obs.addObserver(win => {
    Services.scriptloader.loadSubScript("resource://bookos/bookos.uc.js", win);
    if (Services.env.get("BOOKOS_CAPTURA")) {
      Services.scriptloader.loadSubScript("resource://bookos/captura.uc.js", win);
    }
  }, "browser-delayed-startup-finished");
})();
